# Proxy Writing Assist requests to the host-side WA server (arm64 native).
# Mounted into the container at /etc/nginx/vhost-extras/overleaf/wa-host.conf
# via the compose volume mount. The `location /writing-assist/` prefix takes
# priority over the catch-all `location /` (nginx uses longest-prefix match).
#
# IMPORTANT: The Host header must include the WA server's port (3050).
# Node.js >= 19 enforces strict Host header checking and rejects requests
# where the Host port doesn't match the server's listening port. The default
# `$host` variable from nginx omits the port for standard HTTP (80/443),
# causing Node.js to reject the proxied request with 403 Forbidden.
# `$http_host` includes the port, but it reflects the *client's* port (80).
# We need the *backend's* port, so we construct it explicitly.
location /writing-assist/ {
    proxy_pass http://host.docker.internal:3050;
    proxy_http_version 1.1;
    proxy_set_header Host host.docker.internal:3050;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}